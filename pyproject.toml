[project]
name = "canovaccio"
version = "0.6.0"
description = "Compose, arrange and play: tracks and linked segments, piano roll and real notation in sync, chords and guitar chords with strum, chord track with Yamaha style accompaniment, MIDI keyboard recording, import from MIDI, MuseScore, MusicXML and Rosegarden."
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "editor/resources/fonts/OFL.txt"]
dependencies = ["mido>=1.3", "pyfluidsynth>=1.3", "python-rtmidi>=1.5"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
canovaccio = "editor.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
