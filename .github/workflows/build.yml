# Costruzione dei binari di Canovaccio su GitHub Actions (2026-11-23).
#
# - A ogni tag vX.Y.Z spedito con il push: costruisce i binari e li allega alla Release del tag.
# - A mano (scheda Actions › Build › Run workflow): costruisce senza pubblicare; i file si scaricano
#   dagli "Artifacts" del run, per provarli prima di fare il tag.
#
# Job (2026-11-23: Windows e macOS aggiunti insieme, scelta dell'utente):
# - soundfont: prende TimGM6mb dal pacchetto Ubuntu e lo passa agli altri job;
# - appimage: Linux, Ubuntu 24.04 (GTK 4.10+; gira su Ubuntu 24.04+, Mint 22+, Debian 13+, Fedora 40+);
# - windows: zip con la cartella del programma, costruito con MSYS2 (UCRT64);
# - macos: .dmg per Apple Silicon (solo arm64, scelta dell'utente), costruito con Homebrew;
# - release: con un tag, allega alla Release i file dei job riusciti (uno che fallisce non blocca gli altri).

name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # per allegare i binari alla Release

jobs:
  soundfont:
    runs-on: ubuntu-24.04
    steps:
      - name: TimGM6mb (GPL-2) with its license
        run: |
          sudo apt-get update
          sudo apt-get install -y timgm6mb-soundfont
          mkdir -p soundfonts
          cp /usr/share/sounds/sf2/TimGM6mb.sf2 soundfonts/
          cp /usr/share/doc/timgm6mb-soundfont/copyright soundfonts/TimGM6mb-LICENSE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: soundfont
          path: soundfonts/

  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System packages (GTK 4, PyGObject, FluidSynth, TimGM6mb)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-gi python3-gi-cairo gir1.2-gtk-4.0 \
            libfluidsynth3 timgm6mb-soundfont librsvg2-common librsvg2-bin adwaita-icon-theme

      - name: Python environment
        # Python di sistema: il venv deve vedere PyGObject e pycairo installati con apt
        run: |
          /usr/bin/python3 -m venv --system-site-packages .venv
          .venv/bin/pip install mido pyfluidsynth python-rtmidi pyinstaller pytest

      - name: Tests
        run: .venv/bin/python -m pytest -q

      - name: Build AppImage
        run: packaging/build-appimage.sh

      - name: Keep the AppImage as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: Canovaccio-Linux
          path: dist/*.AppImage

  windows:
    needs: soundfont
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: MSYS2 packages (GTK 4, PyGObject, FluidSynth, PyInstaller, tools to build python-rtmidi)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          pacboy: >-
            python:p python-pip:p python-gobject:p gtk4:p adwaita-icon-theme:p librsvg:p fluidsynth:p
            pyinstaller:p python-pillow:p python-pytest:p cc:p meson:p ninja:p cython:p meson-python:p pkgconf:p

      - uses: actions/download-artifact@v4
        with:
          name: soundfont
          path: build/soundfonts

      - name: Python environment
        # Python di MSYS2: il venv vede PyGObject, PyInstaller e Pillow di MSYS2; python-rtmidi non ha un pacchetto
        # MSYS2 né wheel per questo Python: si compila con gli strumenti di MSYS2 (senza isolamento della build)
        run: |
          python -m venv --system-site-packages .venv
          PY=.venv/bin/python; [ -x "$PY" ] || PY=.venv/Scripts/python.exe
          "$PY" -m pip install mido pyfluidsynth
          "$PY" -m pip install --no-build-isolation python-rtmidi

      - name: Tests
        # 2026-11-23: per ora non bloccano la build (primi giri su Windows): si leggono nel log
        continue-on-error: true
        run: |
          PY=.venv/bin/python; [ -x "$PY" ] || PY=.venv/Scripts/python.exe
          "$PY" -m pytest -q

      - name: Build
        run: packaging/build-windows.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Canovaccio-Windows
          path: dist/*.zip

  macos:
    needs: soundfont
    # Apple Silicon; Homebrew costruisce per questa versione di macOS (15 o più nuova). 2026-11-23: macos-14
    # non è più disponibile su GitHub ("The configuration macos-14-arm64 is not supported")
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Homebrew packages (GTK 4, PyGObject, FluidSynth)
        run: brew install gtk4 pygobject3 fluid-synth librsvg adwaita-icon-theme

      - uses: actions/download-artifact@v4
        with:
          name: soundfont
          path: build/soundfonts

      - name: Python environment
        # il Python di Homebrew con cui è costruito pygobject3, perché il venv lo veda
        run: |
          PYTHON="$(brew --prefix)/opt/$(brew deps pygobject3 | grep -m1 '^python@')/bin/python3"
          "$PYTHON" -m venv --system-site-packages .venv
          .venv/bin/pip install mido pyfluidsynth python-rtmidi pyinstaller pytest pillow

      - name: Tests
        # 2026-11-23: per ora non bloccano la build (primi giri su macOS): si leggono nel log
        continue-on-error: true
        run: .venv/bin/python -m pytest -q

      - name: Build
        run: packaging/build-macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Canovaccio-macOS
          path: dist/*.dmg

  release:
    needs: [appimage, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Canovaccio-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/*.zip
            dist/*.dmg
          fail_on_unmatched_files: false
