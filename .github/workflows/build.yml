# Costruzione dei binari di Canovaccio su GitHub Actions (2026-11-23).
#
# - A ogni tag vX.Y.Z spedito con il push: costruisce l'AppImage e lo allega alla Release del tag.
# - A mano (scheda Actions › Build › Run workflow): costruisce senza pubblicare; l'AppImage si scarica
#   dagli "Artifacts" del run, per provarlo prima di fare il tag.
#
# Ubuntu 24.04: Canovaccio usa GTK 4.10 o successivo; l'AppImage gira sui sistemi con glibc uguale o più
# nuova (Ubuntu 24.04+, Mint 22+, Debian 13+, Fedora 40+). Windows e macOS si aggiungeranno qui come altri job.

name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # per allegare l'AppImage alla Release

jobs:
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System packages (GTK 4, PyGObject, FluidSynth, TimGM6mb)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-gi python3-gi-cairo gir1.2-gtk-4.0 \
            libfluidsynth3 timgm6mb-soundfont librsvg2-common adwaita-icon-theme

      - name: Python environment
        # Python di sistema: il venv deve vedere PyGObject e pycairo installati con apt
        run: |
          /usr/bin/python3 -m venv --system-site-packages .venv
          .venv/bin/pip install mido pyfluidsynth python-rtmidi pyinstaller pytest

      - name: Tests
        run: .venv/bin/python -m pytest -q

      - name: Build AppImage
        run: packaging/build-appimage.sh

      - name: Keep the AppImage as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: Canovaccio-AppImage
          path: dist/*.AppImage

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.AppImage
